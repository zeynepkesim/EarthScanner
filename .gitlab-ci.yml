image: elixir:1.16

stages: [test]

variables:
  MIX_ENV: "test"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "earth_scanner_test"

services:
  - name: postgres:16
    alias: db
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    variables:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "earth_scanner_test"

cache:
  paths:
    - deps
    - _build

before_script:
  - mix local.hex --force
  - mix local.rebar --force
  - mix deps.get

test:
  stage: test
  script:
    - |
      for i in $(seq 1 30); do
        (echo > /dev/tcp/$POSTGRES_HOST/$POSTGRES_PORT) >/dev/null 2>&1 && echo "Postgres is up" && break
        echo "Waiting for Postgres ($i/30) ..."
        sleep 1
      done
    - MIX_ENV=test mix ecto.create
    - MIX_ENV=test mix ecto.migrate
    - mix format --check-formatted
    - MIX_ENV=test mix test --color
